<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Lavender Market — Choose Your Adventure</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --bg:        #fdf6ea;
  --card:      #ffffff;
  --surface:   #fff2da;
  --surface2:  #ffe6b8;
  --gold:      #d98c2b;
  --gold-dim:  #a86a1c;
  --text:      #2b2014;
  --muted:     #8a7860;
  --border:    rgba(180,100,30,0.16);
  --red:       #c1272d;
  --blue:      #2f6f9e;
  --green:     #3f7d4a;
  --purple:    #7a4f9e;
  --amber:     #e8a33d;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html, body {
  min-height:100%;
  font-family:'Segoe UI', system-ui, Arial, sans-serif;
  background:radial-gradient(ellipse at 50% 0%, #fff2da 0%, var(--bg) 75%);
  color:var(--text);
  font-size:16px;
  line-height:1.5;
}
.wrap {
  max-width:880px;
  margin:0 auto;
  padding:20px 14px 48px;
}
.card {
  background:var(--card);
  border-radius:18px;
  border:1px solid var(--border);
  box-shadow:0 24px 60px rgba(120,80,30,0.14);
  padding:24px 24px 20px;
}
.game-header {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  margin-bottom:22px;
  padding-bottom:18px;
  border-bottom:1px solid var(--border);
  gap:12px;
}
.game-title {
  font-size:22px;
  font-weight:900;
  letter-spacing:0.3px;
  color:var(--text);
}
.lamp {
  color:var(--gold);
  animation:lamp-flicker 12s 4s ease-in-out infinite;
  display:inline;
}
@keyframes lamp-flicker {
  0%,90%,93%,97%,100% { opacity:1 }
  91%  { opacity:.45 }
  92%  { opacity:1 }
  95%  { opacity:.6 }
  96%  { opacity:1 }
}
.game-byline {
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
  letter-spacing:0.5px;
}
.header-right {
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:10px;
  flex-shrink:0;
}
.level-badge {
  display:inline-block;
  padding:4px 10px;
  border-radius:6px;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:0.5px;
  color:#fff;
}
.level-badge.platinum { background:linear-gradient(135deg,#9ca3af,#6b7280); }
.level-badge.red      { background:linear-gradient(135deg,#ef4444,#b91c1c); }
.level-badge.blue     { background:linear-gradient(135deg,#3b82f6,#1d4ed8); }
.level-badge.green    { background:linear-gradient(135deg,#22c55e,#15803d); }
.header-controls {
  display:flex;
  gap:6px;
  align-items:center;
}
.speed-btn {
  padding:7px 11px;
  font-size:12px;
  font-weight:700;
  letter-spacing:0.2px;
  white-space:nowrap;
}
.trail { display:flex; gap:6px; align-items:center; }
.dot {
  width:9px; height:9px;
  border-radius:50%;
  background:rgba(0,0,0,0.08);
  border:1px solid rgba(0,0,0,0.08);
  transition:background .3s, box-shadow .3s;
}
.dot.done { background:rgba(217,140,43,.4); border-color:rgba(217,140,43,.4); }
.dot.now  { background:var(--gold); border-color:var(--gold); box-shadow:0 0 9px var(--gold); }
.btn {
  padding:10px 16px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:700;
  font-size:14px;
  line-height:1;
  transition:opacity .15s, transform .1s;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.btn:hover  { opacity:.84; transform:translateY(-1px); }
.btn:active { transform:translateY(0); }
.btn-primary { background:linear-gradient(135deg,#e8a33d,#c1791f); color:#2b2014; }
.btn-ghost   { background:rgba(0,0,0,0.045); color:var(--text); border:1px solid var(--border); }
.btn-icon    { padding:8px 10px; font-size:18px; }
.level-grid {
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:12px;
  margin-top:20px;
}
.level-card {
  background:var(--surface);
  border-radius:12px;
  border:2px solid transparent;
  cursor:pointer;
  padding:20px 16px;
  text-align:center;
  transition:transform .15s, box-shadow .15s, border-color .15s;
}
.level-card:hover, .level-card:focus {
  transform:translateY(-4px);
  box-shadow:0 10px 24px rgba(120,80,30,.18), 0 0 0 1px var(--gold);
  border-color:var(--gold);
  outline:none;
}
.level-card.active {
  border-color:var(--gold);
  box-shadow:0 0 0 2px var(--gold);
  background:var(--surface2);
}
.level-emoji { font-size:42px; display:block; margin-bottom:8px; }
.level-name { font-size:16px; font-weight:700; color:var(--text); }
.level-desc { font-size:12px; color:var(--muted); margin-top:4px; }
.scene-eyebrow {
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:2px;
  color:var(--gold-dim);
  font-weight:700;
  margin-bottom:8px;
}
.scene-img-wrap {
  width:100%;
  height:140px;
  border-radius:10px;
  background:var(--surface2);
  overflow:hidden;
  position:relative;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.scene-emoji-slot {
  font-size:72px;
  line-height:1;
  position:relative;
  z-index:1;
  text-align:center;
}
.fade {
  position:absolute;
  inset:0;
  background:linear-gradient(0deg, rgba(255,230,184,.92) 0%, rgba(255,230,184,.08) 100%);
  pointer-events:none;
}
.scene-text {
  font-size:16px;
  line-height:1.7;
  color:var(--text);
  padding:13px 16px;
  margin-bottom:16px;
  border-left:3px solid var(--gold);
  border-radius:0 8px 8px 0;
  background:rgba(217,140,43,.06);
}
.question-label {
  font-size:19px;
  font-weight:700;
  margin-bottom:12px;
  color:var(--text);
}
.opt-grid { display:grid; gap:10px; }
.opt-card {
  background:var(--surface);
  border-radius:10px;
  border:1px solid rgba(0,0,0,0.06);
  cursor:pointer;
  overflow:hidden;
  transition:transform .15s, box-shadow .15s, border-color .15s;
  user-select:none;
}
.opt-card:hover, .opt-card:focus {
  transform:translateY(-4px);
  box-shadow:0 10px 24px rgba(120,80,30,.18), 0 0 0 1px var(--gold);
  border-color:var(--gold);
  outline:none;
}
.opt-card.escape-card:hover, .opt-card.escape-card:focus {
  box-shadow:0 10px 24px rgba(193,39,45,.22), 0 0 0 1px var(--red);
  border-color:var(--red);
}
.opt-emoji-box {
  width:100%;
  height:88px;
  background:var(--surface2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  line-height:1;
}
.opt-label {
  padding:8px 8px 10px;
  font-size:14px;
  font-weight:700;
  text-align:center;
  color:var(--text);
  line-height:1.25;
}
.escape-card .opt-label { color:var(--red); }
.affirm {
  min-height:22px;
  font-size:14px;
  color:var(--gold-dim);
  font-style:italic;
  text-align:center;
  margin-top:8px;
}
.name-screen { text-align:center; padding:34px 16px 24px; }
.name-screen .hero { font-size:58px; display:block; margin-bottom:14px; }
.name-screen h2 { font-size:26px; font-weight:900; margin-bottom:10px; }
.name-screen p {
  font-size:15px; color:#5c4a36; line-height:1.7;
  margin-bottom:24px; max-width:440px; margin-left:auto; margin-right:auto;
}
.text-input {
  padding:12px 16px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(0,0,0,0.03);
  color:var(--text);
  font-size:16px;
  width:260px;
  max-width:100%;
  outline:none;
  display:block;
  margin:0 auto 16px;
}
.text-input:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(217,140,43,.16); }
.custom-prompt {
  grid-column:1 / -1;
  text-align:center;
  padding:22px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}
.custom-prompt .prompt-q { font-size:17px; color:var(--text); }
.custom-row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.ending-screen { text-align:center; padding:8px 4px; }
.ending-emoji  { font-size:58px; display:block; margin-bottom:10px; }
.ending-title  { font-size:25px; font-weight:900; margin-bottom:14px; }
.ending-text {
  font-size:16px; line-height:1.8;
  color:var(--text);
  max-width:640px; margin:0 auto 20px;
  padding:18px 22px; border-radius:12px;
  text-align:left;
}
.end-escape  .ending-title { color:var(--red);    }
.end-hospital .ending-title { color:var(--blue);  }
.end-school  .ending-title { color:var(--green);  }
.end-jail    .ending-title { color:var(--purple); }
.end-custom  .ending-title { color:var(--gold-dim);  }
.end-escape  .ending-text { background:rgba(193,39,45,.08);   border:1px solid rgba(193,39,45,.22);   }
.end-hospital .ending-text { background:rgba(47,111,158,.08); border:1px solid rgba(47,111,158,.22); }
.end-school  .ending-text { background:rgba(63,125,74,.08);  border:1px solid rgba(63,125,74,.22);  }
.end-jail    .ending-text { background:rgba(122,79,158,.08); border:1px solid rgba(122,79,158,.22); }
.end-custom  .ending-text { background:rgba(217,140,43,.08);  border:1px solid rgba(217,140,43,.22);  }
.journey-block { margin:18px 0; text-align:left; }
.journey-eyebrow {
  font-size:11px; font-weight:700;
  text-transform:uppercase; letter-spacing:1.5px;
  color:var(--muted); margin-bottom:10px;
}
.journey-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(145px,1fr));
  gap:8px;
}
.j-card {
  background:rgba(0,0,0,0.025);
  border:1px solid rgba(0,0,0,0.06);
  border-radius:8px;
  padding:10px 12px;
}
.j-scene  { font-size:11px; color:var(--muted); margin-bottom:4px; }
.j-choice { font-size:14px; font-weight:700; color:var(--text); }
.btn-row {
  display:flex; gap:8px; flex-wrap:wrap;
  justify-content:center; margin-top:18px;
}
footer {
  margin-top:18px;
  text-align:center;
  font-size:11px;
  color:var(--muted);
  letter-spacing:0.3px;
}
</style>

<body>
<div class="wrap">
  <div class="card">
    <header class="game-header">
      <div class="title-block">
        <div class="game-title"><span class="lamp">Lavender Market</span></div>
        <div class="game-byline">Choose Your Adventure · Money Skills · <span id="levelBadge" class="level-badge red">Red</span></div>
      </div>
      <div class="header-right">
        <div class="trail" id="trail"></div>
        <div class="header-controls">
          <button class="btn btn-ghost speed-btn" id="speedBtn" title="Playback speed: Normal">▶ Normal</button>
          <button class="btn btn-ghost btn-icon"  id="soundBtn" title="Toggle sound">🔊</button>
        </div>
      </div>
    </header>
    <main id="stage"></main>
    <footer>Talking in Pictures · SEND Resource · www.talkinginpictures.co.uk</footer>
  </div>
</div>

<script>
/* ==========================================================
   EMOJI MAP
   ========================================================== */
var EMOJI_MAP = {
  "market launch": "🧺", "list": "📝", "fruit stall": "🍎",
  "coins": "🪙", "ten pound note": "💷", "change": "💰",
  "thief alert": "📢", "bag check": "👜", "aunt": "👩",
  "market street": "🏪", "bakery": "🥐", "juice": "🧃",
  "bus stop": "🚌", "oyster card": "💳", "tap in": "✅",
  "success": "🏆", "helped": "🤝", "custom": "✨",
  "apples": "🍎", "bananas": "🍌", "bread": "🍞", "drink": "🧃",
  "shop": "🛒", "money": "💵", "bus": "🚌", "home": "🏠",
  "count": "🔢", "purse": "👛", "wallet": "💼"
};

function getEmoji(term) {
  return EMOJI_MAP[term] || "❓";
}

function renderEmoji(emoji, size) {
  size = size || "48px";
  return '<span style="font-size:' + size + ';line-height:1;display:inline-block;" aria-hidden="true">' + emoji + '</span>';
}

/* ==========================================================
   LEVEL CONFIGURATION
   ========================================================== */
var LEVELS = {
  platinum: { label: "Platinum", badgeClass: "platinum", desc: "Highest ability — full coins, notes & change" },
  red:      { label: "Red",      badgeClass: "red",      desc: "Most able in complex needs — whole pounds only" },
  blue:     { label: "Blue",     badgeClass: "blue",     desc: "Middle level — shorter, simpler sentences" },
  green:    { label: "Green",    badgeClass: "green",    desc: "Most complex — symbols, 1-2 choices, SVO sentences" }

});

speedBtn.addEventListener("click", function () {
  speedIdx   = (speedIdx + 1) % SPEEDS.length;
  speechRate = SPEEDS[speedIdx].rate;

  speedBtn.title = "Playback speed: " + SPEEDS[speedIdx].title;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
});

  return "opt_" + String(s).replace(/[^a-zA-Z0-9]+/g, "_");
}

var NODE_ORDERS = {
  platinum: ["start", "fruit_stall", "thief_scene", "bakery_stall", "bus_stop"],
  red:      ["start", "fruit_stall", "bakery_stall", "bus_stop"],
  blue:     ["start", "fruit_stall", "bakery_stall", "bus_stop"],
  green:    ["start", "fruit_stall", "bakery_stall", "bus_stop"]
};

function setTrail(nodeId) {
  var order = NODE_ORDERS[state.level];
  var idx = order.indexOf(nodeId);
  if (idx === -1) { trailEl.innerHTML = ""; return; }
  trailEl.innerHTML = order.map(function (_, i) {
    var cls = i < idx ? "dot done" : i === idx ? "dot now" : "dot";
    return '<div class="' + cls + '"></div>';
  }).join("");
}

function clearTrail() { trailEl.innerHTML = ""; }

function getNodes() {
  if (state.level === "platinum") return PLATINUM_NODES;
  if (state.level === "red") return RED_NODES;
  if (state.level === "blue") return BLUE_NODES;
  if (state.level === "green") return GREEN_NODES;
  return RED_NODES;
}

function updateLevelBadge() {
  var lvl = LEVELS[state.level];
  if (lvl && levelBadge) {
    levelBadge.textContent = lvl.label;
    levelBadge.className = "level-badge " + lvl.badgeClass;
  }
}

/* ==========================================================
   SPEECH
   ========================================================== */
function speak(text, onEnd) {
  if (!soundOn || !window.speechSynthesis) {
    if (onEnd) onEnd();
    return;
  }
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB";
    u.rate = speechRate;

    var fired = false;
    var done = function () {
      if (!fired) { fired = true; if (onEnd) onEnd(); }
    };
    u.onend  = done;
    u.onerror = done;
    var ms = Math.max(Math.ceil(text.length * 80 / speechRate) + 2000, 3000);
    setTimeout(done, ms);
    window.speechSynthesis.speak(u);
  } catch (e) {
    console.warn("TTS error:", e);
    if (onEnd) onEnd();
  }
}

/* ==========================================================
   SCREEN: LEVEL SELECT
   ========================================================== */
function renderLevelSelect() {
  clearTrail();
  state.name = "";
  state.currentNode = "start";
  state.choices = [];
  state.customDest = "";

  var levelCards = "";
  var levels = ["platinum", "red", "blue", "green"];
  for (var i = 0; i < levels.length; i++) {
    var lvl = levels[i];
    var info = LEVELS[lvl];
    var isActive = state.level === lvl ? " active" : "";
    var emoji = lvl === "platinum" ? "🏆" : lvl === "red" ? "🔴" : lvl === "blue" ? "🔵" : "🟢";
    levelCards +=
      '<div class="level-card' + isActive + '" data-level="' + lvl + '" tabindex="0" role="button">' +
        '<span class="level-emoji">' + emoji + '</span>' +
        '<div class="level-name">' + info.label + ' Level</div>' +
        '<div class="level-desc">' + info.desc + '</div>' +
      '</div>';
  }

  stage.innerHTML =
    '<div class="name-screen">' +
      '<span class="hero">🧺</span>' +
      '<h2>Choose Your Level</h2>' +
      '<p>Pick the level that matches your money skills today.</p>' +
      '<div class="level-grid">' + levelCards + '</div>' +
      '<div style="margin-top:24px;">' +
        '<button class="btn btn-primary" id="levelContinue">Continue →</button>' +
      '</div>' +
    '</div>';

  var cards = document.querySelectorAll(".level-card");
  for (var j = 0; j < cards.length; j++) {
    cards[j].addEventListener("click", function () {
      state.level = this.getAttribute("data-level");
      updateLevelBadge();
      renderLevelSelect();
    });
    cards[j].addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        state.level = this.getAttribute("data-level");
        updateLevelBadge();
        renderLevelSelect();
      }
    });
  }

  document.getElementById("levelContinue").addEventListener("click", function () {
    renderWelcome();
  });
}

/* ==========================================================
   SCREEN: WELCOME (Name Entry)
   ========================================================== */
function renderWelcome() {
  clearTrail();
  state.name = "";
  state.currentNode = "start";
  state.choices = [];
  state.customDest = "";

  var levelInfo = LEVELS[state.level];
  var levelEmoji = state.level === "platinum" ? "🏆" : state.level === "red" ? "🔴" : state.level === "blue" ? "🔵" : "🟢";

  stage.innerHTML =
    '<div class="name-screen">' +
      '<span class="hero">🧺</span>' +
      '<h2>Lavender Market</h2>' +
      '<p>' + levelEmoji + ' <strong>' + levelInfo.label + ' Level</strong><br><br>' +
         "You're off to Lavender Market with Aunt Jas.<br>" +
         'Help with the shopping.<br>' +
         'Watch your money carefully.<br>' +
         'Then catch the bus home!<br><br>' +
         'What is your name, shopper?</p>' +
      '<input class="text-input" id="nameIn" placeholder="Enter your name..."' +
             ' maxlength="30" autocomplete="off"/>' +
      '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">' +
        '<button class="btn btn-primary" id="startBtn">Continue →</button>' +
        '<button class="btn btn-ghost" id="changeLevelBtn">⚙️ Change Level</button>' +
      '</div>' +
    '</div>';

  var inp = document.getElementById("nameIn");
  var btn = document.getElementById("startBtn");
  var changeBtn = document.getElementById("changeLevelBtn");

  inp.addEventListener("keydown", function (e) {
    if (e.key === "Enter") btn.click();
  });

  btn.addEventListener("click", function () {
    var n = (inp.value || "").trim();
    if (!n) {
      inp.focus();
      inp.style.borderColor = "var(--red)";
      return;
    }
    state.name = n;
    speak("Welcome, " + n + "! Let the market adventure begin!", function () {
      renderNode("start");
    });
  });

  changeBtn.addEventListener("click", renderLevelSelect);
}

/* ==========================================================
   SCREEN: SCENE NODE
   ========================================================== */
function renderNode(nodeId) {
  var nodes = getNodes();
  var node = nodes[nodeId];
  if (!node || node.isEnding) return;
  state.currentNode = nodeId;
  setTrail(nodeId);

  var n = node.options.length;
  var cols = n === 4 ? 2 : (n > 3 ? 3 : n);
  if (state.level === "green") cols = 1;

  var sceneEmojiHtml = renderEmoji(getEmoji(node.sceneImg), "72px");

  var optionsHtml = "";
  for (var i = 0; i < node.options.length; i++) {
    var opt = node.options[i];
    var cls = opt.isEscape ? "opt-card escape-card" : "opt-card";
    var emojiHtml = renderEmoji(getEmoji(opt.img), "48px");
    optionsHtml +=
      '<div class="' + cls + '"' +
          ' id="' + safeId(opt.label) + '"' +
          ' tabindex="0" role="button" aria-label="' + opt.label + '">' +
        '<div class="opt-emoji-box">' + emojiHtml + '</div>' +
        '<div class="opt-label">' + opt.label + '</div>' +
      '</div>';
  }

  var sceneTextFilled = node.sceneText.replace(/\{name\}/g, state.name);

  stage.innerHTML =
    '<div class="scene-eyebrow">' + node.sceneLabel + '</div>' +
    '<div class="scene-img-wrap">' +
      '<div class="scene-emoji-slot">' + sceneEmojiHtml + '</div>' +
      '<div class="fade"></div>' +
    '</div>' +
    '<div class="scene-text">' + sceneTextFilled + '</div>' +
    '<div class="question-label">' + node.question + '</div>' +
    '<div class="opt-grid" id="optGrid" style="grid-template-columns:repeat(' + cols + ',1fr)">' +
      optionsHtml +
    '</div>' +
    '<div class="affirm" id="affirm"></div>' +
    '<div style="text-align:center;margin-top:12px;">' +
      '<button class="btn btn-ghost" id="changeLevelMid">⚙️ Change Level</button>' +
    '</div>';

  speak(sceneTextFilled + " " + node.question);

  for (var j = 0; j < node.options.length; j++) {
    (function (opt) {
      var el = document.getElementById(safeId(opt.label));
      if (!el) return;
      el.onclick = function () { onChoose(opt); };
      el.onkeydown = function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          onChoose(opt);
        }
      };
    })(node.options[j]);
  }

  var midBtn = document.getElementById("changeLevelMid");
  if (midBtn) {
    midBtn.addEventListener("click", function () {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      renderLevelSelect();
    });
  }
}

/* ==========================================================
   CHOICE HANDLER
   ========================================================== */
function onChoose(opt) {
  var grid = document.getElementById("optGrid");
  if (grid) grid.style.pointerEvents = "none";

  if (opt.isCustom) { showCustom(opt); return; }

  var nodes = getNodes();
  var node = nodes[state.currentNode];

  var rawLines = (opt.lines && opt.lines.length)
    ? opt.lines
    : ["You choose: " + opt.label + ".", state.name + " — " + opt.label + "."];
  var rawMsg = rawLines[Math.floor(Math.random() * rawLines.length)];
  var msg = rawMsg.replace(/\{name\}/g, state.name);

  state.choices.push({
    scene: node.sceneLabel,
    question: node.question,
    label: opt.label,
    narrative: msg,
    sceneText: node.sceneText.replace(/\{name\}/g, state.name)
  });

  var aff = document.getElementById("affirm");
  if (aff) aff.textContent = msg;

  speak(msg, function () {
    setTimeout(function () {
      if (opt.next.indexOf("ending_") === 0) {
        renderEnding(opt.next);
      } else {
        renderNode(opt.next);
      }
    }, 500);
  });
}

/* ==========================================================
   CUSTOM INPUT SCREEN
   ========================================================== */
function showCustom(opt) {
  var nodes = getNodes();
  var node = nodes[state.currentNode];
  var isDest = state.currentNode === "oyster_check_aunt";

  var prompts = {
    "oyster_check_aunt": "How does your market day end?"
  };
  var promptText = prompts[state.currentNode] || "What happens next?";

  var grid = document.getElementById("optGrid");
  if (!grid) return;
  grid.style.gridTemplateColumns = "1fr";
  grid.innerHTML =
    '<div class="custom-prompt">' +
      '<div class="prompt-q">' + promptText + '</div>' +
      '<div class="custom-row">' +
        '<input class="text-input" id="custIn"' +
               ' placeholder="Type your answer..."' +
               ' maxlength="60" style="margin:0;width:240px"/>' +
        '<button class="btn btn-primary" id="custGo">Continue →</button>' +
      '</div>' +
    '</div>';

  var inp = document.getElementById("custIn");
  var go = document.getElementById("custGo");
  inp.focus();

  inp.addEventListener("keydown", function (e) {
    if (e.key === "Enter") go.click();
  });

  go.addEventListener("click", function () {
    var val = (inp.value || "").trim();
    if (!val) { inp.focus(); return; }

    var customNarrative = state.name + " decided: " + val + ".";

    state.choices.push({
      scene: node.sceneLabel,
      question: node.question,
      label: val,
      isCustom: true,
      narrative: customNarrative,
      sceneText: node.sceneText.replace(/\{name\}/g, state.name)
    });

    if (isDest) {
      state.customDest = val;
      renderEnding("ending_custom");
    } else {
      speak(val + ". Continue.", function () {
        setTimeout(function () { renderNode(opt.next); }, 400);
      });
    }
  });
}

/* ==========================================================
   SCREEN: ENDING
   ========================================================== */
function renderEnding(endId) {
  var nodes = getNodes();
  var end = nodes[endId];
  if (!end) return;
  clearTrail();

  var txt = end.text;
  if (endId === "ending_custom") {
    var dest = state.customDest || "a brilliant finish";
    txt = state.name + " decided how the day ends: " + dest + ". Whatever happens next, " +
          state.name + " practised counting money and budgeting like a pro all market day!";
  }
  txt = txt.replace(/\{name\}/g, state.name);

  var journey = "";
  for (var ci = 0; ci < state.choices.length; ci++) {
    var c = state.choices[ci];
    journey +=
      '<div class="j-card">' +
        '<div class="j-scene">' + c.scene + '</div>' +
        '<div class="j-choice">' + c.label + '</div>' +
      '</div>';
  }

  stage.innerHTML =
    '<div class="ending-screen end-' + end.endingClass + '">' +
      '<span class="ending-emoji">' + end.emoji + '</span>' +
      '<div class="ending-title">Ending: ' + end.title + '</div>' +
      '<div class="ending-text" id="endTxt">' + txt + '</div>' +
      '<div class="journey-block">' +
        '<div class="journey-eyebrow">📍 ' + state.name + "'s market day</div>" +
        '<div class="journey-grid">' + journey + '</div>' +
      '</div>' +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="readBtn">🔊 Read Aloud</button>' +
        '<button class="btn btn-ghost"   id="pdfBtn">📄 Save as PDF</button>' +
        '<button class="btn btn-ghost"   id="againBtn">🔄 Play Again</button>' +
        '<button class="btn btn-ghost"   id="changeLevelEnd">⚙️ Change Level</button>' +
      '</div>' +
    '</div>';

  speak(end.title + ". " + txt);

  document.getElementById("readBtn").addEventListener("click", function () {
    speak(state.name + "'s story. " + txt);
  });
  document.getElementById("pdfBtn").addEventListener("click", function () {
    savePDF(end, txt);
  });
  document.getElementById("againBtn").addEventListener("click", renderWelcome);
  document.getElementById("changeLevelEnd").addEventListener("click", renderLevelSelect);
}

/* ==========================================================
   PDF EXPORT
   ========================================================== */
function savePDF(end, txt) {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    alert("PDF library not loaded. Please check your internet connection.");
    return;
  }
  var jsPDF = window.jspdf.jsPDF;

  var doc = new jsPDF({ unit: "pt", format: "a4", orientation: "portrait" });
  var pageWidth = 595.28;
  var pageHeight = 841.89;
  var margin = 54;
  var contentWidth = pageWidth - (margin * 2);

  doc.setFillColor(253, 246, 234);
  doc.rect(0, 0, pageWidth, pageHeight, "F");

  doc.setDrawColor(217, 140, 43);
  doc.setLineWidth(1.5);
  doc.line(margin, 110, pageWidth - margin, 110);
  doc.line(margin, pageHeight - 75, pageWidth - margin, pageHeight - 75);

  doc.setFont("Helvetica", "bold");
  doc.setFontSize(22);
  doc.setTextColor(43, 32, 20);
  doc.text("LAVENDER MARKET", margin, 80);

  doc.setFont("Helvetica", "normal");
  doc.setFontSize(9);
  doc.setTextColor(138, 120, 96);
  doc.text("Choose Your Adventure — Money Skills, TIPS Reader", margin, 98);

  var dateString = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  var metaText = "Shopper: " + state.name + "  |  " + LEVELS[state.level].label + " Level  |  " + dateString;
  doc.setFont("Helvetica", "bold");
  doc.setFontSize(9);
  doc.setTextColor(43, 32, 20);
  doc.text(metaText, pageWidth - margin, 98, { align: "right" });

  var paragraphs = [];
  for (var ci = 0; ci < state.choices.length; ci++) {
    var c = state.choices[ci];
    paragraphs.push(c.sceneText + " " + c.narrative);
  }

  var endingTitle = "ENDING: " + end.title.toUpperCase();
  var endingBody = txt;

  var fontSize = 10.5;
  var lineSpacing = 15;
  var paraSpacing = 11;
  var startY = 140;
  var maxY = 745;

  var wrappedParas = [];
  var wrappedEnding = [];
  var totalHeight = 0;

  function computeLayout(fSize, lSpacing, pSpacing) {
    doc.setFontSize(fSize);
    doc.setFont("Helvetica", "normal");
    var h = 0;
    wrappedParas = [];
    for (var i = 0; i < paragraphs.length; i++) {
      var lines = doc.splitTextToSize(paragraphs[i], contentWidth);
      wrappedParas.push(lines);
      h += lines.length * lSpacing;
      if (i < paragraphs.length - 1) h += pSpacing;
    }
    h += 25;
    h += 18;
    wrappedEnding = doc.splitTextToSize(endingBody, contentWidth);
    h += wrappedEnding.length * lSpacing;
    return h;
  }

  totalHeight = computeLayout(fontSize, lineSpacing, paraSpacing);
  while (startY + totalHeight > maxY && fontSize > 8) {
    fontSize -= 0.5;
    lineSpacing -= 0.7;
    paraSpacing -= 0.5;
    totalHeight = computeLayout(fontSize, lineSpacing, paraSpacing);
  }

  var currY = startY;
  doc.setFontSize(fontSize);
  doc.setTextColor(43, 32, 20);

  for (var i = 0; i < paragraphs.length; i++) {
    var lines = wrappedParas[i];
    doc.setFont("Helvetica", "normal");
    for (var l = 0; l < lines.length; l++) {
      doc.text(lines[l], margin, currY);
      currY += lineSpacing;
    }
    if (i < paragraphs.length - 1) currY += paraSpacing;
  }

  currY += paraSpacing + 4;
  doc.setFont("Helvetica", "bold");
  doc.setFontSize(fontSize + 1);
  doc.setTextColor(217, 140, 43);
  doc.text("•   •   •", pageWidth / 2, currY, { align: "center" });
  currY += 20;

  doc.setFont("Helvetica", "bold");
  doc.setFontSize(fontSize);
  doc.setTextColor(217, 140, 43);
  doc.text(endingTitle, margin, currY);
  currY += 15;

  doc.setFont("Helvetica", "normal");
  doc.setTextColor(43, 32, 20);
  for (var l = 0; l < wrappedEnding.length; l++) {
    doc.text(wrappedEnding[l], margin, currY);
    currY += lineSpacing;
  }

  doc.setFont("Helvetica", "normal");
  doc.setFontSize(8);
  doc.setTextColor(138, 120, 96);
  var footerText = "Talking in Pictures  |  SEND Resource  |  www.talkinginpictures.co.uk";
  doc.text(footerText, margin, pageHeight - 55);

  var fileBase = (state.name || "shopper").replace(/[^a-z0-9]/gi, "_").toLowerCase();
  doc.save(fileBase + "_lavender_market_adventure.pdf");
}

/* ==========================================================
   BOOT
   ========================================================== */
updateLevelBadge();
renderLevelSelect();
</script>
</body>
