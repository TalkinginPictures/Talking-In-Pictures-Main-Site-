<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Solar System — Choose Your Adventure</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --bg:        #0a0a1a;
  --card:      #12122a;
  --surface:   #1a1a3e;
  --surface2:  #0d0d24;
  --gold:      #f0c040;
  --gold-dim:  #a08020;
  --text:      #f0ece0;
  --muted:     #5e5a6e;
  --border:    rgba(240,192,64,0.13);
  --red:       #e84343;
  --blue:      #3a9fd1;
  --green:     #4caf7d;
  --purple:    #9b6bd4;
  --amber:     #f0a830;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html, body {
  min-height:100%;
  font-family:'Segoe UI', system-ui, Arial, sans-serif;
  background:radial-gradient(ellipse at 50% 0%, #1a1a3e 0%, var(--bg) 75%);
  color:var(--text);
  font-size:16px;
  line-height:1.5;
}
.wrap {
  max-width:880px;
  margin:0 auto;
  padding:20px 14px 48px;
}
.card {
  background:var(--card);
  border-radius:18px;
  border:1px solid var(--border);
  box-shadow:0 28px 80px rgba(0,0,0,0.7);
  padding:24px 24px 20px;
}
.game-header {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  margin-bottom:22px;
  padding-bottom:18px;
  border-bottom:1px solid var(--border);
  gap:12px;
}
.game-title {
  font-size:22px;
  font-weight:900;
  letter-spacing:0.3px;
  color:var(--text);
}
.lamp {
  color:var(--gold);
  animation:lamp-flicker 12s 4s ease-in-out infinite;
  display:inline;
}
@keyframes lamp-flicker {
  0%,90%,93%,97%,100% { opacity:1 }
  91%  { opacity:.45 }
  92%  { opacity:1 }
  95%  { opacity:.6 }
  96%  { opacity:1 }
}
.game-byline {
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
  letter-spacing:0.5px;
}
.header-right {
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:10px;
  flex-shrink:0;
}
.header-controls {
  display:flex;
  gap:6px;
  align-items:center;
}
.speed-btn {
  padding:7px 11px;
  font-size:12px;
  font-weight:700;
  letter-spacing:0.2px;
  white-space:nowrap;
}
.trail { display:flex; gap:6px; align-items:center; }
.dot {
  width:9px; height:9px;
  border-radius:50%;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.08);
  transition:background .3s, box-shadow .3s;
}
.dot.done { background:rgba(240,192,64,.35); border-color:rgba(240,192,64,.35); }
.dot.now  { background:var(--gold); border-color:var(--gold); box-shadow:0 0 9px var(--gold); }
.btn {
  padding:10px 16px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:700;
  font-size:14px;
  line-height:1;
  transition:opacity .15s, transform .1s;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.btn:hover  { opacity:.84; transform:translateY(-1px); }
.btn:active { transform:translateY(0); }
.btn-primary { background:linear-gradient(135deg,#f0c040,#c8a020); color:#07060a; }
.btn-ghost   { background:rgba(255,255,255,0.05); color:var(--text); border:1px solid var(--border); }
.btn-icon    { padding:8px 10px; font-size:18px; }
.level-grid {
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:12px;
  margin-top:20px;
}
.level-card {
  background:var(--surface);
  border-radius:12px;
  border:2px solid transparent;
  cursor:pointer;
  padding:20px 16px;
  text-align:center;
  transition:transform .15s, box-shadow .15s, border-color .15s;
}
.level-card:hover, .level-card:focus {
  transform:translateY(-4px);
  box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 0 1px var(--gold);
  border-color:var(--gold);
  outline:none;
}
.level-emoji { font-size:42px; display:block; margin-bottom:8px; }
.level-name { font-size:16px; font-weight:700; color:var(--text); }
.level-desc { font-size:12px; color:var(--muted); margin-top:4px; }
.scene-eyebrow {
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:2px;
  color:var(--gold);
  font-weight:700;
  margin-bottom:8px;
}
.scene-img-wrap {
  width:100%;
  height:140px;
  border-radius:10px;
  background:var(--surface2);
  overflow:hidden;
  position:relative;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.scene-emoji-slot {
  font-size:72px;
  line-height:1;
  position:relative;
  z-index:1;
  text-align:center;
}
.fade {
  position:absolute;
  inset:0;
  background:linear-gradient(0deg, rgba(10,10,26,.92) 0%, rgba(10,10,26,.1) 100%);
  pointer-events:none;
}
.scene-text {
  font-size:16px;
  line-height:1.7;
  color:#ddd6c8;
  padding:13px 16px;
  margin-bottom:16px;
  border-left:3px solid var(--gold);
  border-radius:0 8px 8px 0;
  background:rgba(240,192,64,.04);
}
.question-label {
  font-size:19px;
  font-weight:700;
  margin-bottom:12px;
  color:var(--text);
}
.opt-grid { display:grid; gap:10px; }
.opt-card {
  background:var(--surface);
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.05);
  cursor:pointer;
  overflow:hidden;
  transition:transform .15s, box-shadow .15s, border-color .15s;
  user-select:none;
}
.opt-card:hover, .opt-card:focus {
  transform:translateY(-4px);
  box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 0 1px var(--gold);
  border-color:var(--gold);
  outline:none;
}
.opt-card.escape-card:hover, .opt-card.escape-card:focus {
  box-shadow:0 10px 30px rgba(232,67,67,.3), 0 0 0 1px var(--red);
  border-color:var(--red);
}
.opt-emoji-box {
  width:100%;
  height:88px;
  background:var(--surface2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  line-height:1;
}
.opt-label {
  padding:8px 8px 10px;
  font-size:14px;
  font-weight:700;
  text-align:center;
  color:var(--text);
  line-height:1.25;
}
.escape-card .opt-label { color:#ff9090; }
.affirm {
  min-height:22px;
  font-size:14px;
  color:var(--gold);
  font-style:italic;
  text-align:center;
  margin-top:8px;
}
.name-screen { text-align:center; padding:34px 16px 24px; }
.name-screen .hero { font-size:58px; display:block; margin-bottom:14px; }
.name-screen h2 { font-size:26px; font-weight:900; margin-bottom:10px; }
.name-screen p {
  font-size:15px; color:#b0a898; line-height:1.7;
  margin-bottom:24px; max-width:440px; margin-left:auto; margin-right:auto;
}
.text-input {
  padding:12px 16px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.04);
  color:var(--text);
  font-size:16px;
  width:260px;
  max-width:100%;
  outline:none;
  display:block;
  margin:0 auto 16px;
}
.text-input:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(240,192,64,.14); }
.custom-prompt {
  grid-column:1 / -1;
  text-align:center;
  padding:22px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}
.custom-prompt .prompt-q { font-size:17px; color:var(--text); }
.custom-row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.ending-screen { text-align:center; padding:8px 4px; }
.ending-emoji  { font-size:58px; display:block; margin-bottom:10px; }
.ending-title  { font-size:25px; font-weight:900; margin-bottom:14px; }
.ending-text {
  font-size:16px; line-height:1.8;
  max-width:640px; margin:0 auto 20px;
  padding:18px 22px; border-radius:12px;
  text-align:left;
}
.end-escape  .ending-title { color:var(--red);    }
.end-hospital .ending-title { color:var(--blue);  }
.end-school  .ending-title { color:var(--green);  }
.end-jail    .ending-title { color:var(--purple); }
.end-custom  .ending-title { color:var(--gold);  }
.end-escape  .ending-text { background:rgba(232,67,67,.07);   border:1px solid rgba(232,67,67,.2);   }
.end-hospital .ending-text { background:rgba(58,159,209,.07); border:1px solid rgba(58,159,209,.2); }
.end-school  .ending-text { background:rgba(76,175,125,.07);  border:1px solid rgba(76,175,125,.2);  }
.end-jail    .ending-text { background:rgba(155,107,212,.07); border:1px solid rgba(155,107,212,.2); }
.end-custom  .ending-text { background:rgba(240,192,64,.07);  border:1px solid rgba(240,192,64,.2);  }
.journey-block { margin:18px 0; text-align:left; }
.journey-eyebrow {
  font-size:11px; font-weight:700;
  text-transform:uppercase; letter-spacing:1.5px;
  color:var(--muted); margin-bottom:10px;
}
.journey-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(145px,1fr));
  gap:8px;
}
.j-card {
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:8px;
  padding:10px 12px;
}
.j-scene  { font-size:11px; color:var(--muted); margin-bottom:4px; }
.j-choice { font-size:14px; font-weight:700; color:var(--text); }
.btn-row {
  display:flex; gap:8px; flex-wrap:wrap;
  justify-content:center; margin-top:18px;
}
footer {
  margin-top:18px;
  text-align:center;
  font-size:11px;
  color:var(--muted);
  letter-spacing:0.3px;
}
</style>

        lines:["{name} stays.","No fuel!"] }
    ]
  },
  pluto_lost: {
    id:"pluto_lost", nodeNum:4,
    sceneLabel:"Scene 4 — No Fuel!",
    sceneText:"No fuel! Cannot go home!",
    question:"Now?",
    sceneImg:"sun",
    options:[
      { label:"Drift", next:"ending_lost", img:"lost",
        lines:["{name} drifts.","Searching!"] }
    ]
  },
  earth_early: {
    id:"earth_early", nodeNum:4,
    sceneLabel:"Scene 4 — Home Early",
    sceneText:"Home early. Safe. Missed planets.",
    question:"Feel?",
    sceneImg:"earth return",
    options:[
      { label:"Happy", next:"ending_partial", img:"partial",
        lines:["{name} happy.","Safe!"] },
      { label:"More", next:"ending_custom", img:"custom",
        lines:["{name} wants more!","Space!"] }
    ]
  },
  return_home: {
    id:"return_home", nodeNum:5,
    sceneLabel:"Scene 5 — Home",
    sceneText:"Go home. Done.",
    question:"Feel?",
    sceneImg:"space journey",
    options:[
      { label:"Happy", next:"ending_success", img:"success",
        lines:["{name} happy!","Good!"] },
      { label:"Not sure", next:"ending_partial", img:"partial",
        lines:["{name} unsure.","Okay."] },
      { label:"More", next:"ending_custom", img:"custom",
        lines:["{name} wants more!","Space!"] }
    ]
  },
  ending_success: {
    id:"ending_success", isEnding:true, endingClass:"school",
    emoji:"🏆",
    title:"Great!",
    text:"You did it! Mercury hot. Venus clouds. Mars red. Jupiter big. Saturn rings. Uranus side. Neptune far. Pluto dwarf. Good job!"
  },
  ending_partial: {
    id:"ending_partial", isEnding:true, endingClass:"hospital",
    emoji:"⚠️",
    title:"Okay",
    text:"Some good. Some not. Gas giants no land. Venus hot. Pluto far. Keep going!"
  },
  ending_rescue: {
    id:"ending_rescue", isEnding:true, endingClass:"escape",
    emoji:"🛟",
    title:"Help!",
    text:"Gas giant or hot planet! No land. Saved! Jupiter Saturn Uranus Neptune. No landing. Mercury Venus too hot. Learned!"
  },
  ending_lost: {
    id:"ending_lost", isEnding:true, endingClass:"jail",
    emoji:"❄️",
    title:"Lost!",
    text:"No fuel. Pluto far. Found! Far = long time. Learned!"
  },
  ending_custom: {
    id:"ending_custom", isEnding:true, endingClass:"custom",
    emoji:"✨",
    title:"You!",
    text:""
  }
};

var NODE_ORDER = ["start", "mercury_orbit", "jupiter_choice", "third_choice", "return_home"];

/* ==========================================================
   STATE
   ========================================================== */
var state   = { name:"", currentNode:"start", choices:[], customDest:"", level:"red" };
var soundOn = true;

var SPEEDS = [
  { label: "🐢 Slow",   rate: 0.6,  title: "Slow"   },
  { label: "▶ Normal",  rate: 0.93, title: "Normal"  },
  { label: "⚡ Fast",   rate: 1.6,  title: "Fast"    },
  { label: "🚀 Turbo",  rate: 2.2,  title: "Turbo"   }
];
var speedIdx   = 1;
var speechRate = SPEEDS[speedIdx].rate;

/* ==========================================================
   DOM REFERENCES
   ========================================================== */
var stage    = document.getElementById("stage");
var trailEl  = document.getElementById("trail");
var soundBtn = document.getElementById("soundBtn");
var speedBtn = document.getElementById("speedBtn");

soundBtn.addEventListener("click", function () {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? "🔊" : "🔇";
  if (!soundOn && window.speechSynthesis) window.speechSynthesis.cancel();
});

speedBtn.addEventListener("click", function () {
  speedIdx   = (speedIdx + 1) % SPEEDS.length;
  speechRate = SPEEDS[speedIdx].rate;
  speedBtn.textContent = SPEEDS[speedIdx].label;
  speedBtn.title = "Playback speed: " + SPEEDS[speedIdx].title;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
});

/* ==========================================================
   UTILITIES
   ========================================================== */
function safeId(s) {
  return "opt_" + String(s).replace(/[^a-zA-Z0-9]+/g, "_");
}

function setTrail(nodeId) {
  var idx = NODE_ORDER.indexOf(nodeId);
  if (idx === -1) { trailEl.innerHTML = ""; return; }
  trailEl.innerHTML = NODE_ORDER.map(function (_, i) {
    var cls = i < idx ? "dot done" : i === idx ? "dot now" : "dot";
    return '<div class="' + cls + '"></div>';
  }).join("");
}

function clearTrail() { trailEl.innerHTML = ""; }

function getNodes() {
  if (state.level === "blue") return BLUE_NODES;
  if (state.level === "green") return GREEN_NODES;
  return RED_NODES;
}

/* ==========================================================
   SPEECH
   ========================================================== */
function speak(text, onEnd) {
  if (!soundOn || !window.speechSynthesis) {
    if (onEnd) onEnd();
    return;
  }
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB";
    u.rate = speechRate;

    var fired = false;
    var done = function () {
      if (!fired) { fired = true; if (onEnd) onEnd(); }
    };
    u.onend  = done;
    u.onerror = done;
    var ms = Math.max(Math.ceil(text.length * 80 / speechRate) + 2000, 3000);
    setTimeout(done, ms);
    window.speechSynthesis.speak(u);
  } catch (e) {
    console.warn("TTS error:", e);
    if (onEnd) onEnd();
  }
}

/* ==========================================================
   SCREEN: WELCOME (Name Entry)
   ========================================================== */
function renderWelcome() {
  clearTrail();
  state.name = "";
  state.currentNode = "start";
  state.choices = [];
  state.customDest = "";
  state.level = "red";

  stage.innerHTML =
    '<div class="name-screen">' +
      '<span class="hero">🚀</span>' +
      '<h2>The Solar System</h2>' +
      '<p>Choose Your Adventure!<br><br>' +
         'You are a space explorer.<br>' +
         'Visit three planets.<br>' +
         'Then return to Earth.<br><br>' +
         'What is your name, explorer?</p>' +
      '<input class="text-input" id="nameIn" placeholder="Enter your name..."' +
             ' maxlength="30" autocomplete="off"/>' +
      '<button class="btn btn-primary" id="startBtn">Continue →</button>' +
    '</div>';

  var inp = document.getElementById("nameIn");
  var btn = document.getElementById("startBtn");

  inp.addEventListener("keydown", function (e) {
    if (e.key === "Enter") btn.click();
  });

  btn.addEventListener("click", function () {
    var n = (inp.value || "").trim();
    if (!n) {
      inp.focus();
      inp.style.borderColor = "var(--red)";
      return;
    }
    state.name = n;
    speak("Welcome, " + n + "!", function () {
      renderLevelSelect();
    });
  });
}

/* ==========================================================
   SCREEN: LEVEL SELECTOR
   ========================================================== */
function renderLevelSelect() {
  clearTrail();
  stage.innerHTML =
    '<div class="name-screen">' +
      '<span class="hero">🚀</span>' +
      '<h2>Hello, ' + state.name + '!</h2>' +
      '<p>Choose your reading level to begin your space adventure.</p>' +
      '<div class="level-grid">' +
        '<div class="level-card" id="levelRed" tabindex="0" role="button" aria-label="Red Level">' +
          '<span class="level-emoji">🔴</span>' +
          '<div class="level-name">Red Level</div>' +
          '<div class="level-desc">Full sentences &amp; detail</div>' +
        '</div>' +
        '<div class="level-card" id="levelBlue" tabindex="0" role="button" aria-label="Blue Level">' +
          '<span class="level-emoji">🔵</span>' +
          '<div class="level-name">Blue Level</div>' +
          '<div class="level-desc">Simple sentences</div>' +
        '</div>' +
        '<div class="level-card" id="levelGreen" tabindex="0" role="button" aria-label="Green Level">' +
          '<span class="level-emoji">🟢</span>' +
          '<div class="level-name">Green Level</div>' +
          '<div class="level-desc">Words &amp; pictures</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.getElementById("levelRed").onclick = function() { selectLevel("red"); };
  document.getElementById("levelRed").onkeydown = function(e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectLevel("red"); } };
  document.getElementById("levelBlue").onclick = function() { selectLevel("blue"); };
  document.getElementById("levelBlue").onkeydown = function(e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectLevel("blue"); } };
  document.getElementById("levelGreen").onclick = function() { selectLevel("green"); };
  document.getElementById("levelGreen").onkeydown = function(e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectLevel("green"); } };
}

function selectLevel(level) {
  state.level = level;
  var levelLabel = level === "red" ? "Red" : level === "blue" ? "Blue" : "Green";
  speak(levelLabel + " Level. Let the adventure begin!", function () {
    renderNode("start");
  });
}

/* ==========================================================
   SCREEN: SCENE NODE
   ========================================================== */
function renderNode(nodeId) {
  var nodes = getNodes();
  var node = nodes[nodeId];
  if (!node || node.isEnding) return;
  state.currentNode = nodeId;
  setTrail(nodeId);

  var n = node.options.length;
  var cols = n === 4 ? 2 : (n > 3 ? 3 : n);

  var sceneEmojiHtml = renderEmoji(getEmoji(node.sceneImg), "72px");

  var optionsHtml = "";
  for (var i = 0; i < node.options.length; i++) {
    var opt = node.options[i];
    var cls = opt.isEscape ? "opt-card escape-card" : "opt-card";
    var emojiHtml = renderEmoji(getEmoji(opt.img), "48px");
    optionsHtml +=
      '<div class="' + cls + '"' +
          ' id="' + safeId(opt.label) + '"' +
          ' tabindex="0" role="button" aria-label="' + opt.label + '">' +
        '<div class="opt-emoji-box">' + emojiHtml + '</div>' +
        '<div class="opt-label">' + opt.label + '</div>' +
      '</div>';
  }

  stage.innerHTML =
    '<div class="scene-eyebrow">' + node.sceneLabel + '</div>' +
    '<div class="scene-img-wrap">' +
      '<div class="scene-emoji-slot">' + sceneEmojiHtml + '</div>' +
      '<div class="fade"></div>' +
    '</div>' +
    '<div class="scene-text">' + node.sceneText + '</div>' +
    '<div class="question-label">' + node.question + '</div>' +
    '<div class="opt-grid" id="optGrid" style="grid-template-columns:repeat(' + cols + ',1fr)">' +
      optionsHtml +
    '</div>' +
    '<div class="affirm" id="affirm"></div>';

  speak(node.sceneText + " " + node.question);

  for (var j = 0; j < node.options.length; j++) {
    (function (opt) {
      var el = document.getElementById(safeId(opt.label));
      if (!el) return;
      el.onclick = function () { onChoose(opt); };
      el.onkeydown = function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          onChoose(opt);
        }
      };
    })(node.options[j]);
  }
}

/* ==========================================================
   CHOICE HANDLER
   ========================================================== */
function onChoose(opt) {
  var grid = document.getElementById("optGrid");
  if (grid) grid.style.pointerEvents = "none";

  if (opt.isCustom) { showCustom(opt); return; }

  var nodes = getNodes();
  var node = nodes[state.currentNode];

  var rawLines = (opt.lines && opt.lines.length)
    ? opt.lines
    : ["You choose: " + opt.label + ".", state.name + " — " + opt.label + "."];
  var rawMsg = rawLines[Math.floor(Math.random() * rawLines.length)];
  var msg = rawMsg.replace(/\{name\}/g, state.name);

  state.choices.push({
    scene: node.sceneLabel,
    question: node.question,
    label: opt.label,
    narrative: msg,
    sceneText: node.sceneText
  });

  var aff = document.getElementById("affirm");
  if (aff) aff.textContent = msg;

  speak(msg, function () {
    setTimeout(function () {
      if (opt.next.indexOf("ending_") === 0) {
        renderEnding(opt.next);
      } else {
        renderNode(opt.next);
      }
    }, 500);
  });
}

/* ==========================================================
   CUSTOM INPUT SCREEN
   ========================================================== */
function showCustom(opt) {
  var nodes = getNodes();
  var node = nodes[state.currentNode];
  var isDest = state.currentNode === "return_home";

  var prompts = {
    "start": "What else?",
    "mercury_orbit": "What else?",
    "venus_visit": "What else?",
    "mars_visit": "What else?",
    "jupiter_choice": "Where else?",
    "jupiter_visit": "What else?",
    "saturn_visit": "What else?",
    "neptune_visit": "What else?",
    "third_choice": "What else?",
    "uranus_visit": "What else?",
    "pluto_visit": "What else?",
    "earth_early": "What else?",
    "return_home": "Where else?"
  };
  var promptText = prompts[state.currentNode] || "What else?";

  var grid = document.getElementById("optGrid");
  if (!grid) return;
  grid.style.gridTemplateColumns = "1fr";
  grid.innerHTML =
    '<div class="custom-prompt">' +
      '<div class="prompt-q">' + promptText + '</div>' +
      '<div class="custom-row">' +
        '<input class="text-input" id="custIn"' +
               ' placeholder="Type your answer..."' +
               ' maxlength="60" style="margin:0;width:240px"/>' +
        '<button class="btn btn-primary" id="custGo">Continue →</button>' +
      '</div>' +
    '</div>';

  var inp = document.getElementById("custIn");
  var go = document.getElementById("custGo");
  inp.focus();

  inp.addEventListener("keydown", function (e) {
    if (e.key === "Enter") go.click();
  });

  go.addEventListener("click", function () {
    var val = (inp.value || "").trim();
    if (!val) { inp.focus(); return; }

    var customNarrative = state.name + " chose " + val + ".";

    state.choices.push({
      scene: node.sceneLabel,
      question: node.question,
      label: val,
      isCustom: true,
      narrative: customNarrative,
      sceneText: node.sceneText
    });

    if (isDest) {
      state.customDest = val;
      renderEnding("ending_custom");
    } else {
      speak(val + ". Continue.", function () {
        setTimeout(function () { renderNode(opt.next); }, 400);
      });
    }
  });
}

/* ==========================================================
   SCREEN: ENDING
   ========================================================== */
function renderEnding(endId) {
  var nodes = getNodes();
  var end = nodes[endId];
  if (!end) return;
  clearTrail();

  var txt = end.text;
  if (endId === "ending_custom") {
    var dest = state.customDest || "somewhere special";
    txt = state.name + " flew to " + dest + ". The solar system is big and amazing. " +
          state.name + " explored space and learned about planets. What a great adventure!";
  }

  var journey = "";
  for (var ci = 0; ci < state.choices.length; ci++) {
    var c = state.choices[ci];
    journey +=
      '<div class="j-card">' +
        '<div class="j-scene">' + c.scene + '</div>' +
        '<div class="j-choice">' + c.label + '</div>' +
      '</div>';
  }

  stage.innerHTML =
    '<div class="ending-screen end-' + end.endingClass + '">' +
      '<span class="ending-emoji">' + end.emoji + '</span>' +
      '<div class="ending-title">Ending: ' + end.title + '</div>' +
      '<div class="ending-text" id="endTxt">' + txt + '</div>' +
      '<div class="journey-block">' +
        '<div class="journey-eyebrow">📍 ' + state.name + "&#39;s journey</div>" +
        '<div class="journey-grid">' + journey + '</div>' +
      '</div>' +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="readBtn">🔊 Read Aloud</button>' +
        '<button class="btn btn-ghost"   id="pdfBtn">📄 Save as PDF</button>' +
        '<button class="btn btn-ghost"   id="againBtn">🔄 Play Again</button>' +
      '</div>' +
    '</div>';

  speak(end.title + ". " + txt);

  document.getElementById("readBtn").addEventListener("click", function () {
    speak(state.name + "'s story. " + txt);
  });
  document.getElementById("pdfBtn").addEventListener("click", function () {
    savePDF(end, txt);
  });
  document.getElementById("againBtn").addEventListener("click", renderWelcome);
}

/* ==========================================================
   PDF EXPORT
   ========================================================== */
function savePDF(end, txt) {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    alert("PDF library not loaded. Please check your internet connection.");
    return;
  }
  var jsPDF = window.jspdf.jsPDF;

  var doc = new jsPDF({ unit: "pt", format: "a4", orientation: "portrait" });
  var pageWidth = 595.28;
  var pageHeight = 841.89;
  var margin = 54;
  var contentWidth = pageWidth - (margin * 2);

  doc.setFillColor(250, 248, 245);
  doc.rect(0, 0, pageWidth, pageHeight, "F");

  doc.setDrawColor(240, 192, 64);
  doc.setLineWidth(1.5);
  doc.line(margin, 110, pageWidth - margin, 110);
  doc.line(margin, pageHeight - 75, pageWidth - margin, pageHeight - 75);

  doc.setFont("Helvetica", "bold");
  doc.setFontSize(22);
  doc.setTextColor(17, 17, 32);
  doc.text("THE SOLAR SYSTEM", margin, 80);

  doc.setFont("Helvetica", "normal");
  doc.setFontSize(9);
  doc.setTextColor(94, 90, 78);
  doc.text("Choose Your Adventure — TIPS Reader", margin, 98);

  var dateString = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  var levelLabel = state.level === "red" ? "Red" : state.level === "blue" ? "Blue" : "Green";
  var metaText = "Explorer: " + state.name + "  |  " + levelLabel + " Level  |  " + dateString;
  doc.setFont("Helvetica", "bold");
  doc.setFontSize(9);
  doc.setTextColor(17, 17, 32);
  doc.text(metaText, pageWidth - margin, 98, { align: "right" });

  var paragraphs = [];
  for (var ci = 0; ci < state.choices.length; ci++) {
    var c = state.choices[ci];
    paragraphs.push(c.sceneText + " " + c.narrative);
  }

  var endingTitle = "ENDING: " + end.title.toUpperCase();
  var endingBody = txt;

  var fontSize = 10.5;
  var lineSpacing = 15;
  var paraSpacing = 11;
  var startY = 140;
  var maxY = 745;

  var wrappedParas = [];
  var wrappedEnding = [];
  var totalHeight = 0;

  function computeLayout(fSize, lSpacing, pSpacing) {
    doc.setFontSize(fSize);
    doc.setFont("Helvetica", "normal");
    var h = 0;
    wrappedParas = [];
    for (var i = 0; i < paragraphs.length; i++) {
      var lines = doc.splitTextToSize(paragraphs[i], contentWidth);
      wrappedParas.push(lines);
      h += lines.length * lSpacing;
      if (i < paragraphs.length - 1) h += pSpacing;
    }
    h += 25;
    h += 18;
    wrappedEnding = doc.splitTextToSize(endingBody, contentWidth);
    h += wrappedEnding.length * lSpacing;
    return h;
  }

  totalHeight = computeLayout(fontSize, lineSpacing, paraSpacing);
  while (startY + totalHeight > maxY && fontSize > 8) {
    fontSize -= 0.5;
    lineSpacing -= 0.7;
    paraSpacing -= 0.5;
    totalHeight = computeLayout(fontSize, lineSpacing, paraSpacing);
  }

  var currY = startY;
  doc.setFontSize(fontSize);
  doc.setTextColor(17, 17, 32);

  for (var i = 0; i < paragraphs.length; i++) {
    var lines = wrappedParas[i];
    doc.setFont("Helvetica", "normal");
    for (var l = 0; l < lines.length; l++) {
      doc.text(lines[l], margin, currY);
      currY += lineSpacing;
    }
    if (i < paragraphs.length - 1) currY += paraSpacing;
  }

  currY += paraSpacing + 4;
  doc.setFont("Helvetica", "bold");
  doc.setFontSize(fontSize + 1);
  doc.setTextColor(240, 192, 64);
  doc.text("•   •   •", pageWidth / 2, currY, { align: "center" });
  currY += 20;

  doc.setFont("Helvetica", "bold");
  doc.setFontSize(fontSize);
  doc.setTextColor(240, 192, 64);
  doc.text(endingTitle, margin, currY);
  currY += 15;

  doc.setFont("Helvetica", "normal");
  doc.setTextColor(17, 17, 32);
  for (var l = 0; l < wrappedEnding.length; l++) {
    doc.text(wrappedEnding[l], margin, currY);
    currY += lineSpacing;
  }

  doc.setFont("Helvetica", "normal");
  doc.setFontSize(8);
  doc.setTextColor(94, 90, 78);
  var footerText = "Talking in Pictures  |  SEND Resource  |  www.talkinginpictures.co.uk";
  doc.text(footerText, margin, pageHeight - 55);

  var fileBase = (state.name || "explorer").replace(/[^a-z0-9]/gi, "_").toLowerCase();
  doc.save(fileBase + "_solar_system_adventure.pdf");
}

/* ==========================================================
   BOOT
   ========================================================== */
renderWelcome();
</script>
