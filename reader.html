<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reader — Talking in Pictures</title>
<meta name="description" content="Interactive graded reader with picture support and text-to-speech." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<base target="_blank">
</head>
<body>

<div class="reader-page">
  <div class="reader-card">
    <!-- Header -->
    <div class="reader-top">
      <div class="rt-title">
        <img src="images/logo.png" alt="" />
        The Big Picnic — Reader
      </div>
      <a href="index.html" class="back-link">← Back</a>
    </div>

    <!-- Level Switcher -->
    <div class="reader-levels">
      <button class="reader-level-btn" data-lvl="jade" onclick="setLevel('jade')">Jade — First Words</button>
      <button class="reader-level-btn" data-lvl="green" onclick="setLevel('green')">Green — Short Phrases</button>
      <button class="reader-level-btn active" data-lvl="blue" onclick="setLevel('blue')">Blue — Full Sentences</button>
      <button class="reader-level-btn" data-lvl="red" onclick="setLevel('red')">Red — Complex Story</button>
    </div>

    <!-- Content -->
    <div class="reader-body" id="reader-body">
      <img class="reader-photo" src="images/package-cover-1.jpg" alt="Story illustration" />
      <h2 class="reader-heading" id="story-title">🐻 The Big Picnic</h2>
      <p class="reader-paragraph" id="story-text">
        Bear was hungry. He saw a picnic. He wanted the sandwich. But the sandwich was gone! Who took it?
      </p>
      <div class="reader-words" id="story-words">
        <div class="reader-word"><span class="rw-emoji">🐻</span><span class="rw-text">Bear</span></div>
        <div class="reader-word"><span class="rw-emoji">🥪</span><span class="rw-text">sandwich</span></div>
        <div class="reader-word"><span class="rw-emoji">🌳</span><span class="rw-text">picnic</span></div>
        <div class="reader-word"><span class="rw-emoji">❓</span><span class="rw-text">who?</span></div>
      </div>
    </div>

    <!-- Navigation -->
    <div class="reader-nav">
      <button id="btn-prev" onclick="prevPage()">← Previous</button>
      <span class="reader-progress" id="progress">Page 1 of 4</span>
      <button class="speak" id="btn-speak" onclick="speakText()">🔊 Read Aloud</button>
      <button id="btn-next" onclick="nextPage()">Next →</button>
    </div>
  </div>
</div>

<script>
// Story data for each level
const stories = {
  jade: {
    title: '🐻 The Big Picnic',
    pages: [
      { text: 'Bear. Hungry.', words: [{e:'🐻',t:'Bear'},{e:'🍽️',t:'hungry'}] },
      { text: 'Sandwich. Yum!', words: [{e:'🥪',t:'sandwich'},{e:'😋',t:'yum'}] },
      { text: 'Gone! Oh no.', words: [{e:'❌',t:'gone'},{e:'😮',t:'oh no'}] },
      { text: 'Bird. Sorry!', words: [{e:'🐦',t:'bird'},{e:'😊',t:'sorry'}] }
    ]
  },
  green: {
    title: '🐻 The Big Picnic',
    pages: [
      { text: 'Bear is hungry. He sees a picnic.', words: [{e:'🐻',t:'Bear'},{e:'🌳',t:'picnic'},{e:'👀',t:'sees'}] },
      { text: 'Bear wants the sandwich. It looks yummy.', words: [{e:'🥪',t:'sandwich'},{e:'🤤',t:'wants'},{e:'😋',t:'yummy'}] },
      { text: 'The sandwich is gone! Where is it?', words: [{e:'❌',t:'gone'},{e:'❓',t:'where?'},{e:'🔍',t:'look'}] },
      { text: 'A bird took it. Bear is surprised!', words: [{e:'🐦',t:'bird'},{e:'😲',t:'surprised'},{e:'🥪',t:'sandwich'}] }
    ]
  },
  blue: {
    title: '🐻 The Big Picnic',
    pages: [
      { text: 'Bear was hungry. He saw a picnic blanket with a big sandwich on it. He wanted that sandwich very much.', words: [{e:'🐻',t:'Bear'},{e:'🥪',t:'sandwich'},{e:'🌳',t:'picnic'}] },
      { text: 'But when Bear looked again, the sandwich was gone! Someone had taken it. Bear was confused.', words: [{e:'❌',t:'gone'},{e:'❓',t:'who?'},{e:'😕',t:'confused'}] },
      { text: 'A little bird flew down with crumbs on her beak. "Sorry Bear," she chirped. "It was just too tasty!"', words: [{e:'🐦',t:'bird'},{e:'😊',t:'sorry'},{e:'🍞',t:'crumbs'}] },
      { text: 'Bear smiled. He shared his berries with Bird. They had a lovely picnic after all.', words: [{e:'🫐',t:'berries'},{e:'🤝',t:'share'},{e:'😊',t:'happy'}] }
    ]
  },
  red: {
    title: '🐻 The Big Picnic',
    pages: [
      { text: 'One sunny morning, Bear wandered through the forest and caught the most delicious smell drifting through the trees. Someone was having a picnic, and there on the blanket sat the biggest, most beautiful sandwich Bear had ever seen.', words: [{e:'🐻',t:'Bear'},{e:'🌲',t:'forest'},{e:'🥪',t:'sandwich'}] },
      { text: 'Bear licked his lips and took a step closer. But just as he reached out his paw, the sandwich vanished! Bear blinked. He looked left. He looked right. The sandwich had completely disappeared, and Bear had no idea where it had gone.', words: [{e:'👀',t:'look'},{e:'❌',t:'gone'},{e:'🤔',t:'mystery'}] },
      { text: 'A tiny bluebird fluttered down from the oak tree above, her beak dusted with breadcrumbs. She looked rather embarrassed. "I am so sorry, Bear," she tweeted. "I saw it sitting there and I simply could not resist. It was the most marvellous sandwich I have ever tasted."', words: [{e:'🐦',t:'bluebird'},{e:'🌳',t:'oak tree'},{e:'😳',t:'sorry'}] },
      { text: 'Bear thought for a moment, then opened his basket. Inside were plump blueberries, sweet strawberries and crunchy nuts. "Let us share," he said kindly. So Bear and Bluebird sat together in the sunshine, and it turned out to be the best picnic either of them had ever had.', words: [{e:'🫐',t:'blueberries'},{e:'🤝',t:'share'},{e:'☀️',t:'sunshine'}] }
    ]
  }
};

let currentLevel = 'blue';
let currentPage = 0;

function setLevel(lvl) {
  currentLevel = lvl;
  currentPage = 0;
  // Update button states
  document.querySelectorAll('.reader-level-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lvl === lvl);
  });
  renderPage();
}

function renderPage() {
  const story = stories[currentLevel];
  const page = story.pages[currentPage];

  document.getElementById('story-title').textContent = story.title;
  document.getElementById('story-text').textContent = page.text;
  document.getElementById('progress').textContent = `Page ${currentPage + 1} of ${story.pages.length}`;

  // Build word cards
  const wordsContainer = document.getElementById('story-words');
  wordsContainer.innerHTML = page.words.map(w => 
    `<div class="reader-word"><span class="rw-emoji">${w.e}</span><span class="rw-text">${w.t}</span></div>`
  ).join('');

  // Update nav buttons
  document.getElementById('btn-prev').disabled = currentPage === 0;
  document.getElementById('btn-next').disabled = currentPage === story.pages.length - 1;
}

function nextPage() {
  const max = stories[currentLevel].pages.length - 1;
  if (currentPage < max) { currentPage++; renderPage(); }
}

function prevPage() {
  if (currentPage > 0) { currentPage--; renderPage(); }
}

function speakText() {
  const text = document.getElementById('story-text').textContent;
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 0.9;
    utter.pitch = 1.1;
    window.speechSynthesis.speak(utter);
  } else {
    alert('Text-to-speech is not supported in this browser.');
  }
}

// Init
renderPage();
</script>

</body>
</html>
